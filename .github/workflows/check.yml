name: check

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Where the hub's header, strip and footer link the website. At go-live this one value becomes https://cascadeprotocol.org.
  WEBSITE_URL: https://site-docs.cascadeprotocol-org.pages.dev

jobs:
  # Which of the jobs that run after the merge a pull request runs as well. On a push, nightly and by hand every one runs;
  # on a pull request the ones that guard the starter, the installed package and the docs site run only when the pull
  # request touches what they guard, so that a change to the runtime's own code waits for lint, tests, conformance and
  # the package alone. Each flag is read from the pull request's files and body at the time the job runs, so a re-run
  # after the body gained a Depends-On line sees it. A change to this workflow does not set a flag: a pull request that
  # edits it shows its moved jobs by `gh workflow run check.yml --ref <branch>`, which runs them all.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.which.outputs.docs }}
      starter: ${{ steps.which.outputs.starter }}
      install: ${{ steps.which.outputs.install }}
    steps:
      - id: which
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL: ${{ github.event.pull_request.number }}
          # docs: the pages' sources and builders, the pack, every Markdown file. The browser build's own test runs in `package`.
          DOCS: '^(docs/|scripts/|packages/(site|evals)/|packages/cascade-runtime/pack/)|\.md$|^package(-lock)?\.json$'
          # starter: the action that checks the starter kit out; a Depends-On line naming a starter kit pull request is read below.
          STARTER: '^\.github/actions/starter/'
          # install: what is packed and installed: a manifest or lock, the pack, every Node-only source (the workers and
          # native files find their neighbours by `import.meta.url`, which differs in the packed layout), the browser files
          # and the database's code, the developer stories and their tests, cascade-mcp and the workflow that installs.
          INSTALL: '(^|/)package(-lock)?\.json$|^packages/cascade-runtime/pack/|^packages/(runtime|cascade-runtime)/src/node/|^packages/runtime/src/(web/|database\.ts|pod-database\.ts)|^packages/runtime/test/developer-story\.test\.ts$|^packages/cascade-runtime/test/offline\.ts$|^developer-story/|^packages/mcp/|^\.github/workflows/installed\.yml$'
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            printf '%s\n' docs=true starter=true install=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PULL}/files" --jq '.[] | .filename, (.previous_filename // empty)')
          body=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PULL}" --jq '(.body // "") | gsub("\r"; "")')
          touches() { if grep -Eq "$1" <<< "$files"; then echo true; else echo false; fi; }
          # The line the starter action reads: the pair of pull requests is proven together before either merges.
          starter=$(touches "$STARTER")
          if grep -iEq '^[[:space:]]*Depends-On:[[:space:]]*(https://github\.com/)?the-cascade-protocol/cascade-starter-kit(#|/pull/)[0-9]+' <<< "$body"; then starter=true; fi
          {
            echo "docs=$(touches "$DOCS")"
            echo "starter=$starter"
            echo "install=$(touches "$INSTALL")"
          } | tee -a "$GITHUB_OUTPUT"

  # What a mistake of a minute's mending shows red from, about two minutes in, while the long jobs go on: the website's
  # chrome copied stale, a type error, a lint or formatting error. Nothing here waits for another job; `compatibility`
  # waits for it and requires it. The steps run whatever the one before found, so one run shows every red there is, except
  # that the type check and the lint need the install. The chrome check passes, with a warning on the run, while the
  # website's preview cannot be read (it now answers with a Cloudflare Access sign-in page).
  fast:
    name: lint and types
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Merges the pull requests a Depends-On: line names into this checkout, so that the checks run on that merge and its
      # lockfile, as the package job's install does.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      # The website owns the chrome: red when packages/site/src/chrome.css differs from the website's, when the website
      # can be read; when it cannot, the script exits 0 and warns. It reads only the website, so it runs before the install.
      - name: The website's chrome is copied as it is
        run: node scripts/sync-chrome.mjs --check
      - id: install
        run: npm ci
        if: ${{ !cancelled() }}
      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
      - name: Lint and formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

  # Before a merge and nightly: a pair of pull requests is proven together before either merges. The suite and the conformance
  # run are jobs side by side, whose results `compatibility`, the required check, reports.
  tests:
    name: tests and conformance
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    # The suite's tests reach no network (packages/cascade-runtime/test/offline.ts); the jobs that install the package, which fetch, leave this unset.
    env:
      CASCADE_TEST_OFFLINE: "1"
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Beside this checkout, where the runtime looks for a component before it fetches one: the offline suite reads
      # the pod-encryption vectors and the reference tables from these, and fetches nothing. The start action honours a
      # Depends-On: line for the vocabulary and the adapters only, so the depends-on action reads it for these two: a pull
      # request of either, named on one, is checked out at its head, else the default branch.
      - id: conformance-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/conformance
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.conformance-at.outputs.repository }}
          ref: ${{ steps.conformance-at.outputs.ref }}
          path: conformance
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      # Node 24: on 22 its V8 aborts a test file now and then ("unreachable code" in the deoptimizer). The package,
      # docs site, starter and installed jobs stay on 22, the oldest Node the package supports.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # On a pull request the conformance command runs once, on the native build, in `conformance (native)`, so
      # this job only checks the counterparts out, before the install, which reads the lockfile of the pull requests the
      # start step merges into this checkout.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      # For the Bridge's pick below. Off a pull request the start step merges the pull requests a Depends-On: line names
      # here into this checkout and runs compatibility.json's host setup, `npm ci`, before the conformance command, so the
      # steps after it run on that merge's lockfile; they run only once it has, which a conformance report shows.
      - id: install
        run: npm ci
      # The Bridge's build, picked with the job's token and kept for the conformance command the start step runs, which
      # holds none.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The checkout-only start step leaves no Python with rdflib, which the search test's hub build needs; the full one
      # installs the validators' own.
      - if: ${{ github.event_name == 'pull_request' }}
        run: python3 -m pip install rdflib==7.6.0
      # Off a pull request: checks the vocabulary and the adapters out beside this repository, and runs the conformance
      # command on them once, on the WebAssembly build: compatibility.json's host is on the native build unless told
      # otherwise, so this step tells it.
      - id: start
        if: ${{ github.event_name != 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        env:
          CASCADE_OXIGRAPH: wasm
      - name: The report the conformance command wrote
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          REPORT: ${{ steps.start.outputs.report }}
        run: |
          set -euo pipefail
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::error::the start step named no conformance report: '$REPORT'"
            exit 1
          fi
          echo "CASCADE_CONFORMANCE_REPORT=$REPORT" >> "$GITHUB_ENV"
      # Every rule beside the note that ruled it and this run's result; its warnings fail nothing yet. Kept as an
      # artifact; the pages on main show the `conformance` job's run, not this one. On a pull request `conformance (native)`
      # has the report, and makes these pages.
      - name: The spec's pages
        if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        continue-on-error: true
        run: |
          npx tsc -b packages/site
          node packages/site/dist/src/node/cli.js build-spec --report "$CASCADE_CONFORMANCE_REPORT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && env.CASCADE_CONFORMANCE_REPORT != '' }}
        with:
          name: spec
          path: cascade-runtime-js/build/spec
          if-no-files-found: warn
      # The suite is run once, in two parts. First the test files each package's test/spec.json lists as randomOrder, in a
      # random order: one that needs another to run first fails here. The seed is in the log; rerun with
      # --test-random-seed=N to repeat it. The type check and the lint are the `lint and types` job's.
      # On a pull request this is the suite's one run, on the WebAssembly build; `tests (native)` runs it on the native
      # build after the merge. The conformance report is asserted on in `conformance (native)`, which wrote it, so the
      # cases that read it are skipped here.
      - name: Tests in random order
        id: listed
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'pull_request' || env.CASCADE_CONFORMANCE_REPORT != '') }}
        shell: bash
        run: |
          skip=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip=(--test-skip-pattern="Reporting a conformance run"); fi
          node scripts/transpile.mjs
          node scripts/test.mjs --listed --test-randomize "${skip[@]}" \
            --test-reporter=./scripts/junit-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/junit-listed.xml" \
            --test-reporter=spec --test-reporter-destination=stdout
      # Then the files that are not listed, as written. Nightly, the `runtime-tests` job runs the suite and keeps its report:
      # once a night, not twice. The JUnit reports of the two parts are read for the test page's shape below, as the
      # `runtime-tests` job reads its own.
      - name: The tests not listed as randomOrder
        id: suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (github.event_name == 'pull_request' || env.CASCADE_CONFORMANCE_REPORT != '') && github.event_name != 'schedule' }}
        shell: bash
        run: |
          skip=()
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then skip=(--test-skip-pattern="Reporting a conformance run"); fi
          node scripts/test.mjs --unlisted "${skip[@]}" \
            --test-reporter=./scripts/junit-reporter.mjs --test-reporter-destination="$RUNNER_TEMP/junit-unlisted.xml" \
            --test-reporter=spec --test-reporter-destination=stdout
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # A case outside a listed capability, nested too deep, or with a leaf that is no verb fails here, named. The files
      # a package's test/spec.json lists as `shaped` are held to it; a package that lists no `capabilities` is skipped.
      - name: The test results read as a specification
        if: ${{ !cancelled() && steps.suite.conclusion != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          reports=()
          for part in listed unlisted; do
            if [ -f "$RUNNER_TEMP/junit-$part.xml" ]; then reports+=("$RUNNER_TEMP/junit-$part.xml"); fi
          done
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "::warning::the runtime's tests wrote no JUnit report, so there is nothing to check"
            exit 0
          fi
          node scripts/spec-shape.mjs "${reports[@]}" packages/cascade-runtime/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/apple-health/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/fhir-pull/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/ccda-download/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/graphdb/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/mcp/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/runtime/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/site/test/spec.json
          node scripts/spec-shape.mjs "${reports[@]}" packages/evals/test/spec.json

  # The conformance command on Oxigraph's native build, the production engine: the build the oxigraph-native workflow
  # published for Linux, fetched and checked against its committed sha256, or, on a pull request that changes
  # native/oxigraph, built here from the pull request's source. On a pull request it runs once, here, through the start action, which
  # comments its table on the pull request, and the cases that assert on its report run against it. On a push to main,
  # nightly and by hand it runs on each build and every example and check must have the same outcome on both; the start
  # action then only checks the counterparts out, so this job posts no table and keeps no report beside the `tests and
  # conformance` job's. The suite on the native build is `tests (native)`, a job of its own, so that the two run side by
  # side and a pull request waits for the longer.
  conformance-native:
    name: conformance (native)
    runs-on: ubuntu-latest
    env:
      CASCADE_TEST_OFFLINE: "1"
    # The start action's comment on the pull request.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - id: conformance-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/conformance
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.conformance-at.outputs.repository }}
          ref: ${{ steps.conformance-at.outputs.ref }}
          path: conformance
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      # Node 24 as the tests job runs the same check.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Before the install, which reads the lockfile of the pull requests the start step merges into this checkout. On a
      # pull request the full start step below does that, after the install it needs the Bridge's build from.
      - if: ${{ github.event_name != 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The published native build, whose sha256 the runtime checks; a pull request that changes native/oxigraph builds it
      # here instead. After the bridge step, whose tsc built the fetch command.
      - uses: ./cascade-runtime-js/.github/actions/oxigraph-native
      # A pull request's one conformance run, on the native build: `native` fails where the build does not load, and
      # never falls back to the WebAssembly one.
      - name: The conformance command runs on the native build
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: echo "CASCADE_OXIGRAPH=native" >> "$GITHUB_ENV"
      - id: start
        if: ${{ github.event_name == 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
      - name: Every example and kit check has the same outcome on each build
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          CASCADE_OXIGRAPH=wasm npm run --silent conformance -- --report "$RUNNER_TEMP/wasm.nt"
          CASCADE_OXIGRAPH=native npm run --silent conformance -- --report "$RUNNER_TEMP/native.nt" 2> >(tee "$RUNNER_TEMP/native.log" >&2)
          grep -q "on Oxigraph's native build" "$RUNNER_TEMP/native.log"
          node scripts/same-outcomes.mjs "$RUNNER_TEMP/wasm.nt" "$RUNNER_TEMP/native.nt"
      # The cases that assert on the report just written, the start step's on a pull request, instead of running the
      # command again. `tests and conformance` skips them on a pull request and `tests (native)` always, so this is where
      # they run: that one test file only, not every file asked which of its cases match.
      - name: The report the conformance command wrote reads as it should
        if: ${{ !cancelled() }}
        env:
          CASCADE_OXIGRAPH: native
          CASCADE_CONFORMANCE_REPORT: ${{ steps.start.outputs.report || format('{0}/native.nt', runner.temp) }}
        run: |
          node scripts/transpile.mjs
          set -o pipefail
          node --import ./packages/cascade-runtime/dist/test/offline.js --test --test-name-pattern="Reporting a conformance run" packages/runtime/dist/test/conformance.test.js | tee "$RUNNER_TEMP/report-cases.log"
          # A pattern that matches nothing exits 0 (the file itself counts as one test), so a renamed describe must fail
          # this step by the describe's name being absent from the output.
          grep -q "Reporting a conformance run" "$RUNNER_TEMP/report-cases.log"
      # Every rule beside the note that ruled it and this run's result, kept as an artifact, as the `tests and conformance`
      # job keeps its own off a pull request.
      - name: The spec's pages
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.start.outputs.report != '' }}
        continue-on-error: true
        env:
          REPORT: ${{ steps.start.outputs.report }}
        run: |
          npx tsc -b packages/site
          node packages/site/dist/src/node/cli.js build-spec --report "$REPORT"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.start.outputs.report != '' }}
        with:
          name: spec
          path: cascade-runtime-js/build/spec
          if-no-files-found: warn

  # The suite on Oxigraph's native build, on a push to main, nightly and by hand, not on a pull request: there it is run
  # once, in `tests and conformance`, on the WebAssembly build, which the random order and the shape
  # check of the results are written for, and a break only the native build shows is found after the merge. No test is
  # the native build's alone; the engine a test file's stores run on is the one CASCADE_OXIGRAPH names. The cases that
  # read the conformance report are `conformance (native)`'s.
  tests-native:
    name: tests (native)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CASCADE_TEST_OFFLINE: "1"
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - id: conformance-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/conformance
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.conformance-at.outputs.repository }}
          ref: ${{ steps.conformance-at.outputs.ref }}
          path: conformance
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      # Node 24 as the tests job runs the same check.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Before the install, which reads the lockfile of the pull requests the start step merges into this checkout.
      - uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The published native build, whose sha256 the runtime checks. After the bridge step, whose tsc built the fetch command.
      - uses: ./cascade-runtime-js/.github/actions/oxigraph-native
      # The search test builds the hub, whose adapter explorers need Python and rdflib.
      - run: python3 -m pip install rdflib==7.6.0
      - name: The runtime's tests on the native build
        env:
          CASCADE_OXIGRAPH: native
          GITHUB_TOKEN: ${{ github.token }}
        run: npm test -- --test-skip-pattern="Reporting a conformance run"

  # The docs site as Pages would serve it: `build-pages` runs the same command, and this job keeps the tree it wrote.
  # After the merge, on a push, nightly and by hand; on a pull request only when it touches what the site is built from
  # (`changes`).
  browser:
    name: docs site
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/cascade-runtime-js/.rows-cache
    # The start action's comment on the pull request is the tests job's to post.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # The website owns the chrome (red when packages/site/src/chrome.css differs from the website's;
      # reported, not red, when the website's file cannot be read from WEBSITE_URL).
      - run: node scripts/sync-chrome.mjs --check
      # Checks the vocabulary and the adapters out beside this repository, and merges into it the pull requests a
      # Depends-On: line names here, before the install reads the lockfile; the package and the pages read those.
      - uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The Pages tree's adapter explorers are made by cascade-bridge-spec's generator, which needs Python and rdflib.
      - run: python3 -m pip install rdflib==7.6.0
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('cascade-runtime-js/.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - name: Pack the package, whose published samples the example pods are
        if: ${{ !cancelled() }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The counterparts the start step checked out, a pull request named on Depends-On among them.
          CASCADE_PACK_SIBLINGS: ${{ github.workspace }}
      # The whole tree, as the deploy builds it: every kit's pod and site, the front page, the quick start and the eval
      # report from the recorded runs (CI never calls a model, it only checks every recorded run renders).
      - name: Build the Pages tree
        if: ${{ !cancelled() }}
        run: npm run build:pages -- --website "${WEBSITE_URL:?WEBSITE_URL is empty, so the hub would link no website}" --built "$(git log -1 --format=%cs)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Every link of the tree resolves as a file, its anchor in it, and a GitHub link into a repository checked out beside
      # this one is read in that checkout, since a pull request's commit is on no server. The addresses on other sites are
      # not asked here but saved, for `external links`, which asks them off this job's path.
      - name: Every link of the tree resolves
        if: ${{ !cancelled() }}
        run: >-
          node scripts/link-check.mjs --tree build/pages --no-external --save-external build/external-links.json
          --checkout the-cascade-protocol/cascade-runtime-js=.
          --checkout the-cascade-protocol/cascade-vocabulary=../cascade-vocabulary
          --checkout the-cascade-protocol/cascade-bridge-adapter-fhir-r4=../cascade-bridge-adapter-fhir-r4
          --checkout the-cascade-protocol/cascade-bridge-adapter-ccda=../cascade-bridge-adapter-ccda
      # Each example pod's explorer data holds together: every file a node with a writer, every act's files there, every
      # view file naming its definition, no label undefined, and the object within its budget of 400 KB.
      - name: Every pod's explorer data holds together
        if: ${{ !cancelled() }}
        run: node scripts/explorer-check.mjs --tree build/pages
      # The browser the `live` job caches on main; a pull request reads it.
      - id: playwright
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        if: ${{ !cancelled() }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
        if: ${{ !cancelled() }}
      # The tests page's script, run in a browser: expand and collapse all, failures only, the glossary filter.
      - name: Run the tests page's script
        if: ${{ !cancelled() }}
        run: npm run test:tests-page
      # The pod explorer's app, run in a browser: a node opens, the log's slider hides later files, a phone's width has no sideways scroll.
      - name: Run the pod explorer
        if: ${{ !cancelled() }}
        run: npm run test:explorer
      # The evals run page's deep links, run in a browser: a point of the reasoning opens and scrolls on its own page, an old ?open= link reaches it.
      - name: Run the evals run page's deep links
        if: ${{ !cancelled() }}
        run: npm run test:evals-page
      # The hub's search box, run in a browser: a click goes to its anchor, the arrows wrap, Enter and Escape, a page with no script.
      - name: Run the hub's search box
        if: ${{ !cancelled() }}
        run: npm run test:search
      # The term index's script, run in a browser: a link to a name in a folded group opens it, a shape's old anchor goes to the shapes' page.
      - name: Run the term index
        if: ${{ !cancelled() }}
        run: npm run test:terms
      # The pipeline page's script, run in a browser: an address that names a step in a closed phase opens it and scrolls to it.
      - name: Run the pipeline page
        if: ${{ !cancelled() }}
        run: npm run test:pod-site
      # The specification pages' contents, run in a browser: the marked rule follows a scroll, an address, a click and the top.
      - name: Run the specification pages
        if: ${{ !cancelled() }}
        run: npm run test:spec-pages
      # A newcomer on the front page of this tree reaches each row of "Find your way" in one click, on a page of the expected title.
      - name: Walk the front page's rows
        if: ${{ !cancelled() }}
        run: npm run test:walkthrough
        env:
          WALK_TREE: build/pages
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('cascade-runtime-js/.rows-cache/**') != '' && hashFiles('cascade-runtime-js/.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pages
          path: cascade-runtime-js/build/pages
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: external-links
          path: cascade-runtime-js/build/external-links.json
          if-no-files-found: error

  # The addresses on other sites that the tree links, asked once each with retries: a 404 is red, a host that does not
  # answer is a warning. Alone and after `docs site`, since asking about five hundred addresses takes a minute, and not
  # in `compatibility`, since a host that moved a page is not this pull request's doing. It runs wherever `docs site` does
  # but nightly, when `live links` asks the same addresses of the deployed site.
  external-links:
    name: external links
    needs: browser
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.browser.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: external-links
          path: build
      - run: node scripts/link-check.mjs --only-external build/external-links.json

  # The reverse check: the starter kit's own tests and checks, run on this commit's tarball, after the merge (push, nightly and
  # by hand) and on a pull request that names a starter kit pull request on Depends-On. A change the starter must
  # follow lands as a pair: this pull request's body carries `Depends-On: https://github.com/the-cascade-protocol/cascade-starter-kit/pull/<n>`
  # (the start action refuses the short form), and the starter is then taken at that pull request's head instead of its main.
  starter-kit:
    name: starter-kit
    if: ${{ needs.changes.outputs.starter == 'true' && !startsWith(github.base_ref, 'alpha/') }}
    needs: [package, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Four parts side by side, each on its own runner: the starter's suites, its browser tests, and the made app without
    # and with the add-ons. `compatibility` reads them as one result, which fails when any part fails.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: suites
          - part: browser
          - part: app
          # The chat and MCP add-ons are the app's only with `--with`, so the base app never runs them. Linux only: on
          # Windows a second check would double its six-minute job, as the starter's own create.yml keeps it.
          - part: app
            with: chat,mcp
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      # Only the action is checked out: the starter is cloned beside it.
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: starter
        uses: ./cascade-runtime-js/.github/actions/starter
        with:
          package: ${{ runner.temp }}/package
      - name: The starter's types and tests
        if: ${{ matrix.part == 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: |
          npm run typecheck
          npm test
      - name: Build try/ and the samples over this tarball
        if: ${{ matrix.part == 'browser' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: npm run build:try
      - id: playwright
        if: ${{ matrix.part != 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        if: ${{ matrix.part != 'suites' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - id: install
        if: ${{ matrix.part != 'suites' }}
        working-directory: ${{ steps.starter.outputs.path }}
        run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.install.outcome == 'success' && steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - name: try/ and the starter in Chromium
        if: ${{ matrix.part == 'browser' }}
        timeout-minutes: 15
        working-directory: ${{ steps.starter.outputs.path }}
        run: npm run test:browser
      # The command a person runs, on the app it makes, with the runtime from this tarball instead of the pin.
      - name: create-cascade-app ${{ matrix.with && format('--with {0}', matrix.with) || '' }}, on this tarball
        if: ${{ matrix.part == 'app' }}
        env:
          STARTER: ${{ steps.starter.outputs.path }}
          TARBALL: ${{ steps.starter.outputs.tarball }}
          WITH: ${{ matrix.with }}
        run: |
          set -euo pipefail
          (cd "$STARTER" && npm run build:create)
          cd "$RUNNER_TEMP"
          node "$STARTER/check/starter.ts" "$STARTER"/build/create-cascade-app-*.tgz --runtime "$TARBALL" ${WITH:+--with "$WITH"}

  # The made app on the other systems, as the deleted installed.yml `starter` job ran it: windows and macos on a push, the
  # nightly run and by hand; windows on a pull request that `changes` says runs the starter. `compatibility` waits for it:
  # an app that does not install on windows is no pass. The starter is taken exactly as `starter-kit` takes it; only the build of the command and the
  # app's check run, not the starter's suites.
  starter-systems:
    name: starter (${{ matrix.os }})
    if: ${{ needs.changes.outputs.starter == 'true' && !startsWith(github.base_ref, 'alpha/') }}
    needs: [package, changes]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: starter
        uses: ./cascade-runtime-js/.github/actions/starter
        with:
          package: ${{ runner.temp }}/package
      # The check reads the made app's screens in Chromium.
      - name: Chromium's headless shell
        working-directory: ${{ steps.starter.outputs.path }}
        run: npx playwright install --only-shell chromium
      - name: create-cascade-app, on this tarball
        env:
          STARTER: ${{ steps.starter.outputs.path }}
          TARBALL: ${{ steps.starter.outputs.tarball }}
        run: |
          set -euo pipefail
          (cd "$STARTER" && npm run build:create)
          cd "$RUNNER_TEMP"
          node "$STARTER/check/starter.ts" "$STARTER"/build/create-cascade-app-*.tgz --runtime "$TARBALL"

  # The packed package's native SQLite binding, installed from the tarball on Node 22 as an app installs it, and opened
  # sealed with a key, on linux and macos on arm and x64, after the merge and on a pull request that changes what is
  # packed or installed (`changes`). The app's second install is `npm ci` from
  # the lock its first wrote, the install that ran node-gyp on the binding when it carried what builds it from source.
  database-systems:
    name: database (${{ matrix.os }})
    if: ${{ needs.changes.outputs.install == 'true' && !startsWith(github.base_ref, 'alpha/') }}
    needs: [package, changes]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: ${{ runner.temp }}/package
      - name: Install the tarball, again from its lock, and open a sealed database with it
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          mkdir app
          cd app
          npm init -y > /dev/null
          npm install --no-audit --no-fund --foreground-scripts "$(node -p "require('node:path').resolve(process.argv[1])" ../package/cascade-runtime-*.tgz)" 2>&1 | tee install.log
          rm -rf node_modules
          npm ci --no-audit --no-fund --foreground-scripts 2>&1 | tee -a install.log
          if grep -q "gyp" install.log; then echo "::error title=database::an install ran node-gyp"; exit 1; fi
          node --version
          node --input-type=module -e '
            import { createRequire } from "node:module";
            import { pathToFileURL } from "node:url";
            const app = createRequire(`${process.cwd()}/`);
            const runtime = createRequire(app.resolve("cascade-runtime/package.json"));
            const { openDatabase } = await import(pathToFileURL(runtime.resolve("@cascade-runtime/runtime/node")).href);
            const { DatabaseKeyRefused } = await import(pathToFileURL(runtime.resolve("@cascade-runtime/runtime")).href);
            const key = new Uint8Array(32).fill(7);
            const first = openDatabase("pod.db", { key });
            first.exec("CREATE TABLE t (v TEXT)");
            first.prepare("INSERT INTO t VALUES (?)").run("sealed");
            first.close();
            const again = openDatabase("pod.db", { key });
            const rows = again.prepare("SELECT v FROM t").all();
            again.close();
            if (JSON.stringify(rows) !== JSON.stringify([{ v: "sealed" }])) throw new Error("reopened with its key, got " + JSON.stringify(rows));
            let refused;
            try { openDatabase("pod.db", { key: new Uint8Array(32).fill(8) }).close(); } catch (error) { refused = error; }
            if (!(refused instanceof DatabaseKeyRefused)) throw new Error("another key was not refused: " + refused);
            console.log("sealed database reopened with its key and refused another");
          '

  # The name branch protection requires. It reports the jobs that run on the event: on a pull request the lint, the tests,
  # the conformance run and the package, and each job `changes` says the pull request runs; on a nightly run or one started
  # by hand every job. A job `changes` leaves out of a pull request is skipped and is no red; a job it says runs, or that
  # runs on this event, must have succeeded, so a skipped one is no pass (`package` is needed so that a failed pack, which
  # skips the jobs after it, cannot pass as their skip). Never on a push, where each job shows its own result. The starter,
  # the starter on the other systems and the database are skipped on a pull request into an alpha/ branch as well.
  compatibility:
    name: compatibility
    needs:
      [
        changes,
        fast,
        tests,
        conformance-native,
        tests-native,
        package,
        browser,
        starter-kit,
        starter-systems,
        database-systems,
        linux,
        other-systems,
        runtime-tests,
      ]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          FAST: ${{ needs.fast.result }}
          TESTS: ${{ needs.tests.result }}
          CONFORMANCE_NATIVE: ${{ needs.conformance-native.result }}
          TESTS_NATIVE: ${{ needs.tests-native.result }}
          PACKAGE: ${{ needs.package.result }}
          BROWSER: ${{ needs.browser.result }}
          STARTER: ${{ needs.starter-kit.result }}
          STARTER_SYSTEMS: ${{ needs.starter-systems.result }}
          DATABASE: ${{ needs.database-systems.result }}
          LINUX: ${{ needs.linux.result }}
          OTHER_SYSTEMS: ${{ needs.other-systems.result }}
          RUNTIME_TESTS: ${{ needs.runtime-tests.result }}
          RUN_DOCS: ${{ needs.changes.outputs.docs }}
          RUN_STARTER: ${{ needs.changes.outputs.starter }}
          RUN_INSTALL: ${{ needs.changes.outputs.install }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          echo "changes: ${CHANGES}; lint and types: ${FAST}; tests and conformance: ${TESTS}; conformance on the native build: ${CONFORMANCE_NATIVE}; tests on the native build: ${TESTS_NATIVE}; package: ${PACKAGE}; docs site: ${BROWSER} (wanted: ${RUN_DOCS}); starter-kit: ${STARTER}; starter on the other systems: ${STARTER_SYSTEMS} (wanted: ${RUN_STARTER}); database on each system: ${DATABASE}, package installed on linux: ${LINUX}, on the other systems: ${OTHER_SYSTEMS} (wanted: ${RUN_INSTALL}); runtime tests: ${RUNTIME_TESTS}"
          bad=0
          # A job that runs on every event.
          always() { [ "$2" = success ] || { echo "::error title=compatibility::$1 is $2, not success"; bad=1; }; }
          # A job that runs when `changes` says so, and is skipped otherwise; a pull request into an integration branch
          # skips the ones marked `integration`; `any` ones are not.
          wanted() {
            if [ "$3" = true ] && { [ "$4" != integration ] || [[ "${BASE}" != alpha/* ]]; }; then
              [ "$2" = success ] || { echo "::error title=compatibility::$1 is $2, and ran on this event, so it must be success"; bad=1; }
            else
              [ "$2" = success ] || [ "$2" = skipped ] || { echo "::error title=compatibility::$1 is $2, not success or skipped"; bad=1; }
            fi
          }
          always changes "${CHANGES}"
          always "lint and types" "${FAST}"
          always "tests and conformance" "${TESTS}"
          always "conformance (native)" "${CONFORMANCE_NATIVE}"
          always package "${PACKAGE}"
          wanted "docs site" "${BROWSER}" "${RUN_DOCS}" any
          wanted starter-kit "${STARTER}" "${RUN_STARTER}" integration
          wanted "starter on the other systems" "${STARTER_SYSTEMS}" "${RUN_STARTER}" integration
          wanted database "${DATABASE}" "${RUN_INSTALL}" integration
          # The package installed, and `tests (native)`, run off a pull request only: on a pull request `tests and
          # conformance` runs the suite once, on the WebAssembly build, and these are skipped by that rule alone.
          if [ "${EVENT}" = pull_request ]; then
            wanted "package installed on linux" "${LINUX}" "${RUN_INSTALL}" any
            wanted "package installed on the other systems" "${OTHER_SYSTEMS}" "${RUN_INSTALL}" any
          else
            always "package installed on linux" "${LINUX}"
            always "package installed on the other systems" "${OTHER_SYSTEMS}"
            always "tests (native)" "${TESTS_NATIVE}"
          fi
          # The suite runs in `runtime-tests` on the nightly run, where `tests and conformance` leaves it out. On a pull
          # request or a hand-started run that job is skipped, and the suite ran in `tests and conformance`.
          if [ "${EVENT}" = schedule ]; then always "runtime tests" "${RUNTIME_TESTS}"; fi
          exit "$bad"

  # The conformance run of main that the Pages tree shows. `tests and conformance` is skipped on a push and its report is
  # not kept for the site, so this job runs the start action alone, on a push and nightly, and keeps the report with the
  # table the check wrote beside it under the artifact name `conformance`. The tests, the lint and the types are not its
  # business, and `build-pages` waits for the job and not for its verdict.
  conformance:
    name: conformance
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Node 24 as the tests job runs the same check.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - run: npm ci
      # The Bridge's build, picked with the job's token and kept for the conformance command, which holds none.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # On the WebAssembly build, which the report the pages show has always been: compatibility.json's host is on the
      # native build unless told otherwise.
      - id: start
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        env:
          CASCADE_OXIGRAPH: wasm
      # The start action names the report it wrote and keeps its table.md two folders up. A run that wrote none keeps
      # nothing, and the pages show every result as not run.
      - name: Keep the report and its table
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REPORT: ${{ steps.start.outputs.report }}
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/conformance"
          mkdir -p "$kept"
          if [ -z "$REPORT" ] || [ ! -f "$REPORT" ]; then
            echo "::warning::the start step named no conformance report: '$REPORT'"
            exit 0
          fi
          cp "$REPORT" "$kept/earl.ttl"
          table="$(dirname "$(dirname "$REPORT")")/table.md"
          if [ -f "$table" ]; then cp "$table" "$kept/table.md"; fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: conformance
          path: ${{ runner.temp }}/conformance
          if-no-files-found: ignore

  # The runtime's own tests on main, in a job the deploy does not wait for: `build-pages` shows the newest finished run's
  # report, as it shows the vocabulary's. A timeout stops a hang. The log stays the spec reporter's; the JUnit file is the
  # test page's, node's own with each case's line in its TypeScript source added, for the page to link to. The tests read the vocabulary beside this checkout, which the start action checks out and does not run. A
  # failing case fails the job, and the report is still kept.
  # Nightly this is the one run of the suite: `tests and conformance` leaves it out then, and `compatibility` waits for this job.
  runtime-tests:
    name: runtime tests
    if: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The suite's tests reach no network (packages/cascade-runtime/test/offline.ts); the jobs that install the package, which fetch, leave this unset.
    env:
      CASCADE_TEST_OFFLINE: "1"
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      # Beside this checkout, where the runtime looks for a component before it fetches one: the offline suite reads
      # the pod-encryption vectors and the reference tables from these, and fetches nothing. The start action honours a
      # Depends-On: line for the vocabulary and the adapters only, so the depends-on action reads it for these two: a pull
      # request of either, named on one, is checked out at its head, else the default branch.
      - id: conformance-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/conformance
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.conformance-at.outputs.repository }}
          ref: ${{ steps.conformance-at.outputs.ref }}
          path: conformance
          persist-credentials: false
      - id: tables-at
        uses: ./cascade-runtime-js/.github/actions/depends-on
        with:
          repository: the-cascade-protocol/cascade-reference-tables
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.tables-at.outputs.repository }}
          ref: ${{ steps.tables-at.outputs.ref }}
          path: cascade-reference-tables
          persist-credentials: false
      # Node 24 as the tests job runs the same suite.
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      - uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The Bridge's build, which the suite's Bridge tests read.
      - run: npm run --silent bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The search test builds the hub, whose adapter explorers need Python and rdflib.
      - run: python3 -m pip install rdflib==7.6.0
      # npm test transpiles its own sources, so it needs no build first.
      - name: The runtime's tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/runtime-tests"
          mkdir -p "$kept"
          printf '{"commit":"%s","at":"%s","url":"%s"}\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$kept/run.json"
          npm test -- --test-reporter=./scripts/junit-reporter.mjs --test-reporter-destination="$kept/junit.xml" \
            --test-reporter=spec --test-reporter-destination=stdout
      # The test page's shape, over the report just written: see the `tests and conformance` job.
      - name: The test results read as a specification
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          kept="$RUNNER_TEMP/runtime-tests"
          if [ ! -f "$kept/junit.xml" ]; then
            echo "::warning::the runtime's tests wrote no JUnit report, so there is nothing to check"
            exit 0
          fi
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/cascade-runtime/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/apple-health/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/fhir-pull/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/ccda-download/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/graphdb/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/mcp/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/runtime/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/site/test/spec.json
          node scripts/spec-shape.mjs "$kept/junit.xml" packages/evals/test/spec.json
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: runtime-tests
          path: ${{ runner.temp }}/runtime-tests
          if-no-files-found: ignore

  # The vocabulary, the adapters and the Bridge are each read at the head of their default branch. On a push to main, and
  # nightly, so a merge in the vocabulary or an adapter reaches the pages the next night. It waits for the conformance
  # run's report and not for its verdict: a red run still deploys, with its failures on the pages, and a run that kept no
  # report deploys with every result shown as not run. It does not wait for the runtime's tests (the page shows their newest
  # finished run, at most one push behind), so the deploy waits no longer than the conformance job.
  build-pages:
    name: build-pages
    needs: [conformance]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # `actions` lets the test reports' lookup list this repository's runs, which a private one would refuse by default.
    permissions:
      contents: read
      actions: read
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/.rows-cache
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # The Pages tree's adapter explorers are made by cascade-bridge-spec's generator, which needs Python and rdflib.
      - run: python3 -m pip install rdflib==7.6.0
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: .rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - name: Pack the package, whose published samples the example pods are
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Nothing to download when the conformance run kept no report, which is no failure.
      - name: The conformance run's report
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: conformance
          path: build/conformance
      # Each repository's unit test page shows the newest run of its suite on main, case by case: for each suite of
      # packages/site/test-suites.json, the newest push or nightly run of its workflow that still holds the report's
      # artifact (a cancelled or unfinished run does not), so a page is at most one push behind and the deploy never waits
      # for a suite. Where the job's token may not download it, or the repository uploads none yet, its page says "not
      # available" and the deploy goes on.
      - name: The test reports
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # fetch <repository> <workflow> <artifact> <the report's file in the artifact> <folder>
          fetch() {
            local repository=$1 workflow=$2 artifact=$3 file=$4 kept=$5 runs held id sha at url try="$5/.try"
            mkdir -p "$kept"
            if ! runs=$(gh run list -R "$repository" -w "$workflow" -b main --limit 20 \
              --json databaseId,event,headSha,createdAt,url \
              --jq '.[] | select(.event == "push" or .event == "schedule") | [.databaseId, .headSha, .createdAt, .url] | @tsv'); then
              echo "::warning::cannot list the $workflow runs of $repository, so its test report is not available"
              return 0
            fi
            # The runs that still hold an artifact of that name, so a repository that uploads none costs one call, not a
            # download for each of its runs.
            if ! held=$(gh api --paginate "repos/$repository/actions/artifacts?name=$artifact&per_page=100" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'); then
              echo "::warning::cannot list the $artifact artifacts of $repository, so its test report is not available"
              return 0
            fi
            while IFS=$'\t' read -r id sha at url; do
              [ -n "$id" ] || continue
              grep -qx "$id" <<< "$held" || continue
              # A fresh folder per candidate: gh does not overwrite and exits 0 on "The file exists", so a half-kept artifact
              # (run.json without the report) would poison every older candidate. The report being there is the success.
              rm -rf "$try"
              mkdir -p "$try"
              gh run download "$id" -R "$repository" -n "$artifact" -D "$try" </dev/null >/dev/null 2>&1 || true
              if [ -f "$try/$file" ]; then
                [ "$file" = report ] || mv "$try/$file" "$try/report"
                [ -f "$try/run.json" ] || printf '{"commit":"%s","at":"%s","url":"%s"}\n' "$sha" "$at" "$url" > "$try/run.json"
                mv "$try"/* "$kept"/
                rm -rf "$try"
                echo "the test report of $repository is of run $id ($url)"
                return 0
              fi
            done <<< "$runs"
            rm -rf "$try"
            echo "::warning::none of the newest runs of $repository holds a $artifact artifact this job can download, so its test report is not available"
          }
          mapfile -t suites < <(jq -r '.[] | [.repository, .workflow, .artifact, .report] | @tsv' packages/site/test-suites.json)
          for suite in "${suites[@]}"; do
            IFS=$'\t' read -r repository workflow artifact file <<< "$suite"
            fetch "$repository" "$workflow" "$artifact" "$file" "build/tests/${repository#*/}"
          done
      - name: Build the Pages tree
        run: npm run build:pages -- --report build/conformance/earl.ttl --tests build/tests --website "${WEBSITE_URL:?WEBSITE_URL is empty, so the hub would link no website}" --built "$(git log -1 --format=%cs)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # llms.txt links absolutely under the address the deploy serves; the pull request's artifact leaves it unset.
          PAGES_URL: https://the-cascade-protocol.github.io/cascade-runtime-js/
      # The check `docs site` runs on a pull request, over the tree this job deploys.
      - name: Every pod's explorer data holds together
        run: node scripts/explorer-check.mjs --tree build/pages
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('.rows-cache/**') != '' && hashFiles('.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: .rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      # The performance pages. /perf/ is "Where the time goes, over time", stacked charts drawn by scripts/perf-stacked.mjs from the
      # performance files on the perf-data branch; the history page that perf.yml's github-action-benchmark step keeps there (a
      # small chart per measurement) is served at /perf/detail/. They are optional pages:
      # a branch that does not exist yet, or a fetch that fails, skips it with a warning and never fails the deploy. It is
      # copied after explorer-check and build:pages, so no check of a pull request sees them (the link check exempts the
      # generated page at /perf/detail/; the others link back to the front page themselves).
      - name: The performance history page
        shell: bash
        run: |
          set -uo pipefail
          remote="https://github.com/${GITHUB_REPOSITORY}"
          git ls-remote --exit-code --heads "$remote" perf-data >/dev/null 2>&1
          looked=$?
          if [ "$looked" -ne 0 ]; then
            echo "::warning::/perf/ is skipped: the perf-data branch could not be listed (git ls-remote exit ${looked}; 2 means there is no such branch yet)"
          elif ! git clone -q --depth 1 --branch perf-data "$remote" "$RUNNER_TEMP/perf-data"; then
            echo "::warning::/perf/ is skipped: the perf-data branch could not be cloned"
          elif [ ! -f "$RUNNER_TEMP/perf-data/perf/index.html" ]; then
            echo "::warning::/perf/ is skipped: perf-data holds no perf/index.html yet"
          else
            mkdir -p build/pages/perf/detail
            cp -r "$RUNNER_TEMP/perf-data/perf/." build/pages/perf/detail/
            # The flame graphs: the speedscope viewer (the pinned package's own release, with its licence) at /perf/speedscope/,
            # and the builds' traces and CPU profiles at /perf/runs/<run>-<sha7>/ with an index of them at /perf/runs/, from the
            # orphan branch `perf-flame` (one commit, which perf.yml writes with the window of builds it keeps). The viewer
            # reads a file by its address, so the files are served from the same site. A branch that does not exist yet, or
            # cannot be cloned, is an index with no builds. Each build's entry also shows its import beside a plain load of
            # the same input into SQLite, from that build's file on perf-data (`--perf-data`).
            mkdir -p "$RUNNER_TEMP/perf-flame"
            if git ls-remote --exit-code --heads "$remote" perf-flame >/dev/null 2>&1; then
              rm -rf "$RUNNER_TEMP/perf-flame"
              git clone -q --depth 1 --branch perf-flame "$remote" "$RUNNER_TEMP/perf-flame" \
                || { mkdir -p "$RUNNER_TEMP/perf-flame"; echo "::warning::/perf/runs/ lists no builds: the perf-flame branch could not be cloned"; }
            fi
            if ! node scripts/perf-runs.mjs pages --data "$RUNNER_TEMP/perf-flame" --out build/pages/perf \
              --viewer node_modules/speedscope/dist/release --viewer-license node_modules/speedscope/LICENSE \
              --repo "$GITHUB_REPOSITORY" --pages "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/perf" \n              --perf-data "$RUNNER_TEMP/perf-data"; then
              echo "::warning::/perf/runs/ is skipped: the builds' flame graphs could not be put in the site"
            fi
            # The main page, after the index of builds, so that a column opens a build's entry only where the index has one.
            if ! node scripts/perf-stacked.mjs pages --data "$RUNNER_TEMP/perf-data" --out build/pages/perf \
              --repo "$GITHUB_REPOSITORY" --runs build/pages/perf/runs; then
              echo "::warning::/perf/ is skipped: the stacked charts could not be drawn"
            fi
          fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  pages:
    name: pages
    needs: [build-pages, release]
    # A push deploys what its release built; the nightly run and a manual run have no release, only the tree to redeploy.
    if: ${{ !cancelled() && needs.build-pages.result == 'success' && (needs.release.result == 'success' || ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.release.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      deployed: ${{ steps.tip.outputs.latest }}
    steps:
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head, not ${{ github.sha }}; the run for $head deploys"
          fi
      - if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/configure-pages@v6
      - id: deployment
        if: ${{ steps.tip.outputs.latest == 'true' }}
        uses: actions/deploy-pages@v5

  # The deployed site, as a person reaches it, once its deploy is served.
  live:
    name: live
    needs: pages
    if: ${{ github.event_name == 'push' && needs.pages.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # A push to main saves this cache where a pull request can read it.
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npm run test:live
        env:
          PAGES_URL: https://the-cascade-protocol.github.io/cascade-runtime-js/
          COMMIT: ${{ github.sha }}

  # The deployed site, nightly and by hand, not on a push: every link of every page, each README's Docs block and the
  # addresses on other sites, and a newcomer's walk from the front page and from each README. The other sites it asks fail
  # about one push in four, which kept main red for what is no code check; `external links` asks the same addresses of the
  # built tree on a push. Nothing waits for it; a dead link or a README without the hub's link fails the run.
  live-links:
    name: live links
    needs: [pages, live]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.pages.outputs.deployed == 'true' && (needs.live.result == 'success' || needs.live.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PAGES_URL: https://the-cascade-protocol.github.io/cascade-runtime-js/
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
      - uses: actions/cache/save@v6
        if: ${{ steps.browsers.outputs.cache-hit != 'true' }}
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: node scripts/link-check.mjs --crawl --site "$PAGES_URL" --readmes
      - if: ${{ !cancelled() }}
        run: npm run test:walkthrough

  # connect and pull against the SMART launcher, a server this project did not write, over the network: nightly and by
  # hand only, so a network failure gates no pull request.
  launcher:
    name: launcher
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:launcher

  # The package, packed once, so every system below tests the same bytes: with the counterparts a pull request names on
  # Depends-On, which the start action checks out beside it, so a pair's two pull requests prove each other; else from the
  # head of every default branch.
  package:
    name: package
    runs-on: ubuntu-latest
    env:
      CASCADE_ROWS_CACHE: ${{ github.workspace }}/cascade-runtime-js/.rows-cache
    defaults:
      run:
        working-directory: cascade-runtime-js
    steps:
      - uses: actions/checkout@v7
        with:
          path: cascade-runtime-js
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cascade-runtime-js/package-lock.json
      # Before the install, which reads the lockfile of the pull requests the start step merges into this checkout.
      - if: ${{ github.event_name == 'pull_request' }}
        uses: the-cascade-protocol/cascade-bridge-spec/.github/actions/start@main
        with:
          checkout-only: "true"
      - run: npm ci
      # The reference tables' row files are named by their content, so a copy kept from an earlier run is as good as a
      # fresh download, and a Pages blip cannot fail a run. What a run fetched anew is saved; a push to main saves where a pull request reads.
      - id: rows
        uses: actions/cache/restore@v6
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}
          restore-keys: table-rows-${{ runner.os }}-
      - id: rows-before
        shell: bash
        run: echo "hash=${{ hashFiles('cascade-runtime-js/.rows-cache/**') }}" >> "$GITHUB_OUTPUT"
      - if: ${{ github.event_name == 'pull_request' }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CASCADE_PACK_SIBLINGS: ${{ github.workspace }}
      - if: ${{ github.event_name != 'pull_request' }}
        run: npm run build:package
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # The packed browser build opens a pod over IndexedDB in Chromium, retitles it and opens it again, and checks the
      # secrets of known-answer 1.2 pods through its Argon2id worker, which no other test starts. It runs here, on every
      # pull request, since a break of the browser build is a logic break; the browser is the one the `live` job caches on main.
      - id: playwright
        run: |
          set -euo pipefail
          version=$(node -p "require('playwright/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-shell
      - run: npx playwright install --only-shell chromium
      - name: Retitle a pod and check a secret in a browser
        run: npm run test:pod-browser
      - name: Drop half-written row files before they are saved
        if: ${{ !cancelled() }}
        shell: bash
        run: rm -f "$CASCADE_ROWS_CACHE"/*.tmp
      - uses: actions/cache/save@v6
        if: ${{ !cancelled() && hashFiles('cascade-runtime-js/.rows-cache/**') != '' && hashFiles('cascade-runtime-js/.rows-cache/**') != steps.rows-before.outputs.hash }}
        with:
          path: cascade-runtime-js/.rows-cache
          key: table-rows-${{ runner.os }}-${{ github.run_id }}-${{ github.job }}
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: |
            cascade-runtime-js/build/cascade-runtime-*.tgz
            cascade-runtime-js/build/cascade-mcp-*.tgz
            cascade-runtime-js/build/release-notes.md
          if-no-files-found: error

  # The package installed and used as a person would, on the systems `release` waits for. After the merge, nightly and by hand,
  # and on a pull request that changes what is packed or installed (`changes`).
  linux:
    needs: [package, changes]
    if: ${{ needs.changes.outputs.install == 'true' }}
    uses: ./.github/workflows/installed.yml
    with:
      systems: '["ubuntu-latest"]'

  # The same jobs on the systems that finish last: nothing needs them, so a release does not wait, and a failure still fails the run.
  other-systems:
    needs: [package, changes]
    if: ${{ needs.changes.outputs.install == 'true' }}
    uses: ./.github/workflows/installed.yml
    with:
      systems: ${{ github.event_name == 'pull_request' && '["windows-latest"]' || '["windows-latest", "macos-latest"]' }}

  # The tested tarball, as the pre-release build-<commit>, never the latest.
  release:
    name: release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: package
          path: package
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$tag is a release already"
            exit 0
          fi
          gh release create "$tag" package/cascade-runtime-*.tgz package/cascade-mcp-*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file package/release-notes.md \
            --prerelease \
            --latest=false
